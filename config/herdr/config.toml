onboarding = false

[ui]
prompt_new_tab_name = false
# Number of lines per mouse scroll tick. Default: 3. This gets multiplied on top of Ghostty multiplier, which is 3 by
# default.
mouse_scroll_lines = 1

[theme]
auto_switch = true
light_name = "solarized-light"
dark_name = "kanagawa"


[keys]
# I keep default keybindings as the 1st element, adding my prefernce as the 2nd. Unless not possible.
prefix = ["ctrl+b", "ctrl+space"]

new_tab = ["prefix+c", "prefix+t"]

navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

copy_mode = ["prefix+[", "prefix+/"]

# default: prefix+s
settings = ["prefix+,"]
split_horizontal = ["prefix+minus", "prefix+s"]

# Config for https://github.com/AVGVSTVS96/herdr-drovr.
# Installation: herdr plugin install AVGVSTVS96/herdr-drovr
[[keys.command]]
key = "prefix+M"
type = "plugin_action"
command = "drovr.move-tab"
description = "move tab to workspace"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "drovr.move-pane"
description = "move pane to tab"
