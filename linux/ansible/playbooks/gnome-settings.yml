- name: Set up gnome-specific settings
  hosts: all
  tasks:

  - name: Set Focus Changer keybindings to use Alt instead of Super
    community.general.dconf:
      key: "/org/gnome/shell/extensions/focus-changer/{{ item.key }}"
      value: "{{ item.value }}"
    loop:
      - key: focus-left
        value: "['<Alt>h']"
      - key: focus-down
        value: "['<Alt>j']"
      - key: focus-up
        value: "['<Alt>k']"
      - key: focus-right
        value: "['<Alt>l']"
    become_user: alex
    become: true
